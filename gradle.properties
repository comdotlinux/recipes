org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Store application id (Android) and bundle id (iOS). The owner confirms the final value.
# iosApp/Configuration/Config.xcconfig must carry the same value; :shared:verifyIosAppId checks it.
APP_ID=com.linux.recipes

# Client build settings, compiled into AppConfig by :shared:generateAppConfig.
# API_BASE_URL: https, no trailing slash. Override per build with -PAPI_BASE_URL=...
API_BASE_URL=https://recipe.munich-tech.de
# OAuth "Web application" client id from Google Cloud; the server checks it as the token audience.
# Not secret, but owner-supplied. Empty means Google sign-in reports Failed until it is set.
GOOGLE_SERVER_CLIENT_ID=
# RevenueCat public SDK keys, one per store (goog_... and appl_...). Not secret; the secret API key lives only
# on the server. Empty means the store is reported unavailable and nothing can be bought.
REVENUECAT_ANDROID_KEY=
REVENUECAT_IOS_KEY=
# Legal pages linked from the paywall.
TERMS_URL=https://recipe.munich-tech.de/terms
PRIVACY_URL=https://recipe.munich-tech.de/privacy

# Screenshot tests compare against the committed baselines in shared/src/androidHostTest/screenshots.
# Re-record with ./gradlew :shared:recordRoborazziAndroidHostTest
roborazzi.test.verify=true
