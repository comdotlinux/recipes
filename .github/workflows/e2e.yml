name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.11.10"
  APP_ID: com.linux.recipes
  # The emulator reaches the host's loopback at 10.0.2.2 (docs/spikes/E2E.md).
  DEBUG_API_BASE_URL: http://10.0.2.2:8787
  E2E_OUT: e2e-output
  # Serial of the emulator the action starts (emulator-port below); e2e/run-android.sh refuses to run without it.
  ANDROID_SERIAL: emulator-5554

jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Everything in mise.toml: bun, node (runtime for wrangler and cf), the JDK, maestro.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          cache-provider: basic
      # Required by android-emulator-runner for hardware acceleration on Linux (its README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local Worker (wrangler dev --env local)
        working-directory: backend
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          # Throwaway per-run secrets for the local entry; never printed. The Turnstile test secret comes from wrangler.jsonc env.local.
          env_file="${RUNNER_TEMP}/e2e.env"
          (umask 077; printf 'USER_ID_PEPPER=%s\nSERVER_KEY=%s\n' "$(openssl rand -base64 32)" "$(openssl rand -base64 32)" > "${env_file}")
          mkdir -p "../${E2E_OUT}"
          nohup bunx wrangler dev --env local --env-file "${env_file}" --ip 127.0.0.1 --port 8787 > "../${E2E_OUT}/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/v1/health; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::wrangler dev did not answer /v1/health within 120 s"
          exit 1
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug "-PDEBUG_API_BASE_URL=${DEBUG_API_BASE_URL}"
      - name: Maestro smoke on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # The action runs each script line as its own command, so the whole run is one script.
          script: bash e2e/run-android.sh
      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: ${{ env.E2E_OUT }}/
          if-no-files-found: warn
          retention-days: 14
